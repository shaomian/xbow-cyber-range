services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    ports:
      - 80
    security_opt:
      - label:disable
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      timeout: 5s
      retries: 20
      interval: 5s
      start_period: 15s