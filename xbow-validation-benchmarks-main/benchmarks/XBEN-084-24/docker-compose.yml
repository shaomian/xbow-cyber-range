services:
  s3:
    build: ./s3
    expose:
      - 8333
    networks:
      - internal
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8333/assets/front_image_1.jpeg", "-o", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        - FLAG
    expose:
      - 3000
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  nginx:
    build: ./nginx
    ports:
      - 80
      - 8333
    networks:
      - default
      - internal
    security_opt:
      - label:disable
    depends_on:
      s3:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  default:
    driver: bridge
  internal:
    driver: bridge