services:
  db:
    build: ./mysql
    expose:
      - 3306
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "--password=admin_router", "-u", "root"]
      timeout: 5s
      retries: 20
      interval: 5s
      start_period: 30s

  haproxy:
    build: ./haproxy
    depends_on:
      mitmproxy:
        condition: service_healthy
    expose:
      - 8001
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthcheck"]
      timeout: 5s
      retries: 20
      interval: 5s
      start_period: 30s
    environment:
      - SERVER_HOSTNAME=admin_router
      - SERVER_PORT=80

  mitmproxy:
    build: ./mitmproxy
    depends_on:
      admin_router:
        condition: service_healthy
    expose:
      - 8002
    ports:
      - 8002
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost:8002"]
      timeout: 5s
      retries: 20
      interval: 5s
      start_period: 30s
    environment:
      - SERVER_HOSTNAME=haproxy
      - SERVER_PORT=8001

  admin_router:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 80
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 5s
      retries: 20
      interval: 5s
      start_period: 30s